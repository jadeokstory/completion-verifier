[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "completion-verifier"
version = "0.1.0"
description = "A local-first postcondition gate for verifiable completion claims"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "jsonschema>=4.18",
  "PyYAML>=6.0",
]

[project.scripts]
completion-verifier = "completion_verifier.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
completion_verifier = [
  "claim-evaluation.schema.json",
  "completion-verifier.schema.json",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
